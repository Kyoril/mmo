syntax = "proto2";
package mmo.proto;

message AreaTriggerEntry {
	required uint32 id = 1;
	required string name = 2;
	required uint32 map = 3;
	required float x = 4;
	required float y = 5;
	required float z = 6;
	optional float radius = 7;
	optional float box_x = 8;
	optional float box_y = 9;
	optional float box_z = 10;
	optional float box_o = 11;
	optional uint32 on_enter_trigger = 12;
	optional uint32 on_exit_trigger = 13;
	/// Upward speed while gliding inside the trigger volume. 0 (or unset) means it is no updraft.
	/// The client reads the same field number from ClientDB, which is a byte copy of this file.
	optional float updraft_strength = 14;
}

message AreaTriggers {
	repeated AreaTriggerEntry entry = 1;
}
