syntax = "proto2";
package mmo.proto;

message ClassBaseValues {
	required uint32 health = 1;
	required uint32 mana = 2;
	required uint32 stamina = 3;
	required uint32 strength = 4;
	required uint32 agility = 5;
	required uint32 intellect = 6;
	required uint32 spirit = 7;
	optional uint32 attributePoints = 8;
	optional uint32 talentPoints = 9;
}

message ClassSpell {
	required uint32 level = 1;
	required uint32 spell = 2;
}

// Per-class-level progression data for CLASS leveling (independent of levelbasevalues /
// xpToNextLevel, which drive CHARACTER leveling). Entry i (0-based) describes class level i+1:
// xptonextlevel is the class XP required to advance from class level i+1 to i+2 (the last
// entry's value is unused), talentpoints is the number of talent points granted AT class
// level i+1. The class max level is classlevels_size(); an empty list means the class does
// not level (class level stays frozen at 1, legacy behavior).
message ClassLevelEntry {
	required uint32 xptonextlevel = 1;
	optional uint32 talentpoints = 2 [default = 0];
}

message AttackPowerStatSource {
	required uint32 statId = 1;
	required float factor = 2;
}

message HealthStatSource {
	required uint32 statId = 1;
	required float factor = 2;
}

message ManaStatSource {
	required uint32 statId = 1;
	required float factor = 2;
}

message ArmorStatSource {
	required uint32 statId = 1;
	required float factor = 2;
}

// A cosmetic outfit shown on the character creation preview so a freshly created character
// is not displayed naked. This is purely client-side eye candy: it grants nothing and is
// unrelated to the actual starting equipment (see races.proto: initialItems). Item display
// ids are used rather than item ids because the client knows display data from ClientDB,
// while item data is owned by the world server and unavailable during character creation.
// NOTE: field numbers of this message and of the outfits field below are shared with the
// client subset schema in src/shared/client_data/classes.proto - keep them in sync.
message CharacterOutfit {
	// Race id this outfit applies to, or -1 for any race. Race ids are 0-based, so 0 is a
	// real race and cannot serve as the wildcard.
	optional int32 race = 1 [default = -1];

	// Gender this outfit applies to (0 = male, 1 = female), or -1 for any gender.
	optional int32 gender = 2 [default = -1];

	// Item display ids applied to the preview model, in order. Armor and weapons alike.
	repeated uint32 item_displays = 3;

	// Skeleton animation state played while the outfit is shown, e.g. "1HReady", "2HReady"
	// or "2HLReady". Empty keeps the model frame's configured idle animation. This has to be
	// named explicitly because in-world the ready clip comes from the equipped weapon's item
	// subclass, which the character creation screen cannot resolve.
	optional string animation = 4;
}

message ClassEntry {
	required uint32 id = 1;
	required string name = 2;
	required string internalName = 3;
	enum PowerType {
		MANA = 0;
		RAGE = 1;
		ENERGY = 2;
	}
	required PowerType powertype = 4;
	required uint32 spellfamily = 5;
	optional uint32 flags = 6;
	repeated ClassBaseValues levelbasevalues = 7;
	repeated ClassSpell spells = 8;
	optional float attackPowerPerLevel = 9;
	optional float attackPowerOffset = 10;
	repeated AttackPowerStatSource attackPowerStatSources = 11;
	// How much mana is regenerated per tick. If this value is 10, then 10 mana is regenerated every tick (+ spirit).
	optional float baseManaRegenPerTick = 12;
	// How much spirit is converted to 1 mana per tick. If this value is 5, then 10 spirit will regenerate 2 mana per regen tick.
	optional float spiritPerManaRegen = 13;
	// How much health is regnerated per tick.
	optional float healthRegenPerTick = 14;
	// How much spirit is converted to 1 health per tick.
	optional float spiritPerHealthRegen = 15;
	
	repeated AttackPowerStatSource armorStatSources = 16;
	optional bool disabled = 23;

	repeated uint32 xpToNextLevel = 17;

	repeated HealthStatSource healthStatSources = 18;
	
	repeated ManaStatSource manaStatSources = 19;

	// Auto-attack spell used when melee auto-attacking with the main hand weapon.
	// If 0, the unit has no melee auto-attack.
	optional uint32 mainhand_auto_attack_spell = 20;

	// Auto-attack spell used when auto-attacking with an off-hand weapon.
	// If 0, no off-hand auto-attack is performed.
	optional uint32 offhand_auto_attack_spell = 21;

	// Auto-attack spell used for ranged auto-attacks (e.g. Auto Shot with a bow).
	// If 0, no ranged auto-attack is performed.
	optional uint32 ranged_auto_attack_spell = 22;

	// Primary attribute sources contributing to the unit's shield block value.
	// Each source adds (statValue * factor) to the block value (e.g. Strength * 0.264).
	repeated AttackPowerStatSource blockvaluestatsources = 24;

	// Primary attribute sources contributing to the unit's critical block chance (in percent).
	// Each source adds (statValue * factor) to the critical block chance.
	repeated AttackPowerStatSource critblockchancestatsources = 25;

	// Spell that grants/activates this class via the ChangeClass spell effect. Granted to a
	// character on creation if this is their initial class. 0 means the class has no associated
	// class-change spell yet.
	optional uint32 class_change_spell = 26;

	// Class-level progression curve (see ClassLevelEntry). NOTE: field numbers of ClassEntry are
	// shared with the client subset schema in src/shared/client_data/classes.proto — keep them in
	// sync when adding fields.
	repeated ClassLevelEntry classlevels = 27;

	// Cosmetic character creation preview outfits (see CharacterOutfit).
	repeated CharacterOutfit outfits = 28;
}

message Classes {
	repeated ClassEntry entry = 1;
}
