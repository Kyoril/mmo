syntax = "proto2";
package mmo.proto;

import "combat_sounds.proto";

// NOTE: Keep this file in sync with src/shared/client_data/model_data.proto!
// The client reads the exported binary data with the mirrored proto_client schema,
// so every field number in here has to match the mirror exactly.

message ModelDataEntry {
	required uint32 id = 1;
	required string name = 2;
	optional uint32 flags = 3;
	required string filename = 4;
	map<uint32, uint32> customizationProperties = 5;

	// SoundEntry id played when the player clicks / interacts with a friendly unit
	// using this display model. 0 = no gossip sound (default).
	optional uint32 gossip_sound_id = 6 [default = 0];

	// SoundEntry id played instead of gossip_sound_id after the player has pestered
	// the same unit repeatedly. 0 = keep playing the normal gossip sound (default).
	optional uint32 gossip_pissed_sound_id = 7 [default = 0];

	// AnimationProfileEntry id driving the model's animation slot bindings.
	// 0 = use the built-in default clip names (Idle, Run, Swim, ...).
	optional uint32 animation_profile = 8 [default = 0];

	// SoundEntry id played when the player closes this NPC's dialog for real,
	// i.e. without another dialog of the same NPC opening right after.
	// 0 = no goodbye sound (default).
	optional uint32 goodbye_sound_id = 9 [default = 0];

	// Combat audio for units using this display model: natural weapon sounds for
	// creatures and unarmed players, the body's hit material, and the combat voice
	// (attacker effort and victim pain reacts).
	optional CombatSounds combat_sounds = 10;

	// Item display ids worn by every non-player unit using this model, applied in order like
	// equipped items: armor hides/shows sub meshes and overrides materials, weapons attach to
	// their (sheathed) bone. Purely client-side visuals. Players ignore it; their look comes
	// from their equipment.
	repeated uint32 item_displays = 11;

	// Effect a unit using this display model plays when it is removed from the world (a
	// temporary pet expiring, a corpse despawning), instead of vanishing at once. Not played
	// when the unit merely leaves the client's sight. Missing = the unit vanishes at once.
	optional UnitTransitionEffect despawn_effect = 12;

	// Effect a unit using this display model plays when it is added to the world (summoned,
	// respawned), e.g. a dissolve played backwards. Not played when the unit merely comes into
	// the client's sight. Missing = the unit appears at once.
	optional UnitTransitionEffect spawn_effect = 13;
}

// A unit's spawn or despawn effect. A despawning unit stays in the scene (no longer targetable)
// until its effect ends; a spawning unit is a normal unit while its effect plays.
message UnitTransitionEffect {
	// Seconds the effect lasts. 0 = the length of `animation`.
	optional float duration = 1 [default = 0.0];

	// Skeleton clip played once when the effect starts (empty = none). Sounds and other events
	// belong on the clip as animation notifies (PlaySound notifies play at the unit).
	optional string animation = 2;

	// Material (.hmat) swapped onto every visible sub mesh while the effect plays (empty = keep
	// the unit's materials). Parameters of the unit's material with the same name and type
	// (textures, colours, scalars) are copied over, so one dissolve material serves every skin.
	optional string material = 3;

	// Scalar material parameter driven over the effect's duration, on every sub mesh whose
	// (possibly swapped) material exposes it: 0 to 1 for a despawn, 1 to 0 for a spawn. A spawn
	// effect restores the unit's own materials when it ends.
	optional string dissolve_parameter = 4 [default = "Dissolve"];

	// SoundEntry id played at the unit when the effect starts. 0 = none.
	optional uint32 sound_id = 5 [default = 0];
}

message ModelDatas {
	repeated ModelDataEntry entry = 1;
}
