syntax = "proto2";
package mmo.proto;

message ActionButton {
	required uint32 action = 1;
	optional uint32 type = 2;
	optional uint32 misc = 3;
	enum ActionButtonUpdateState {
		UNCHANGED	= 0;
		CHANGED		= 1;
		NEW			= 2;
		DELETED		= 3;
	}
	optional ActionButtonUpdateState state = 4 [default = UNCHANGED];
}

message InitialActionButtons {
	map<uint32, ActionButton> actionButtons = 1;
}

message InitialSpells {
	repeated uint32 spells = 1;
}

message InitialItems {
	repeated uint32 items = 1;
}

// Voice lines of one gender of a race.
// NOTE: Keep this message in sync with src/shared/client_data/races.proto!
message VoiceLineSet {
	// Maps a spell cast result value (see spell_cast_result in game/spell.h) to the
	// SoundEntry id of the voice line played when a cast fails with that result.
	map<uint32, uint32> cast_error_sounds = 1;

	// Maps a power type value (see power_type in game/spell.h: Mana=0, Rage=1,
	// Energy=2, Health=3) to the SoundEntry id of the voice line played when a cast
	// fails due to missing power of that type. Falls back to the generic
	// FailedNoPower entry in cast_error_sounds when the power type is not mapped.
	map<uint32, uint32> no_power_sounds = 2;
}

// NOTE: Keep the shared fields of this message in sync with src/shared/client_data/races.proto!
message RaceEntry {
	required uint32 id = 1;
	required string name = 2;
	required uint32 factionTemplate = 3;
	required uint32 malemodel = 4;
	required uint32 femalemodel = 5;
	required uint32 baselanguage = 6;
	required uint32 startingtaximask = 7;
	required uint32 cinematic = 8;
	map<uint32, InitialSpells> initialSpells = 9;
	map<uint32, InitialActionButtons> initialActionButtons = 10;
	map<uint32, InitialItems> initialItems = 11;
	required uint32 startmap = 12;
	required uint32 startzone = 13;
	required float startposx = 14;
	required float startposy = 15;
	required float startposz = 16;
	required float startrotation = 17;
	optional bool disabled = 18;
	// Explicit list of class ids this race is allowed to be (character creation and class-change
	// legality, multi-class system). When empty, legality falls back to inferring from the presence
	// of class-specific initial data (initialSpells / initialItems / initialActionButtons).
	repeated uint32 allowedClasses = 19;
	optional VoiceLineSet male_voice = 20;
	optional VoiceLineSet female_voice = 21;
}

message Races {
	repeated RaceEntry entry = 1;
}
