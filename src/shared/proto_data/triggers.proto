syntax = "proto2";
package mmo.proto;

import "localization.proto";

message TriggerCategoryEntry {
	required uint32 id = 1;
	required string name = 2;
	optional uint32 parent = 3 [default = 0];
}

message TriggerCategories {
	repeated TriggerCategoryEntry entry = 1;
}


enum TriggerComparisonOperator {
	Equal = 0;
	NotEqual = 1;
	Greater = 2;
	GreaterEqual = 3;
	Less = 4;
	LessEqual = 5;
}

enum TriggerFunction {
	Phase = 0;
	Health = 1;
	HealthPct = 2;
	Mana = 3;
	ManaPct = 4;
	IsInCombat = 5;
	EncounterState = 6;
	// Number of players currently in the world instance. FunctionData: NONE.
	PlayerCount = 7;
	// Health percentage (0-100) of the owning unit's current victim. FunctionData: NONE.
	TargetHealthPct = 8;
	// Whether the owning unit has an aura of the given spell. FunctionData: <SPELL-ID>. Returns 1 or 0.
	HasAura = 9;
	// A random integer value. FunctionData: [<MAX>] (default 100) or [<MIN>,<MAX>]. Inclusive.
	RandomValue = 10;
	// Value of an instance-scoped variable. FunctionData: <VARIABLE-KEY>. Returns 0 if unset.
	InstanceVariable = 11;
	// Number of living creatures of a given entry currently in the world instance.
	// FunctionData: <UNIT-ENTRY-ID>. Returns 0 when the entry is missing or none are alive.
	//
	// This is read from the world rather than counted into a variable on purpose: instance
	// variables can only be assigned absolute values, so any counter maintained by hand drifts the
	// moment a summon dies, despawns or is missed. Asking the world how many are actually alive
	// cannot desync, which is what makes it usable for capping adds.
	LivingCreatureCount = 12;
}

enum TriggerConditionType {
	BoolComparison = 0;
	IntegerComparison = 1;
	FloatComparison = 2;
	StringComparison = 3;
	AndCondition = 4;
	OrCondition = 5;
}

message TriggerCondition {
	required TriggerComparisonOperator operator = 1;

	oneof leftvalue {
		int64 leftlong = 2;
		float leftfloat = 3;
		string leftstring = 4;
		TriggerFunction leftfunction = 5;
		TriggerCondition leftcondition = 6;
	}

	oneof rightvalue {
		int64 rightlong = 7;
		float rightfloat = 8;
		string rightstring = 9;
		TriggerFunction rightfunction = 10;
		TriggerCondition rightcondition = 11;
	}

	repeated int64 leftfunctiondata = 12;
	repeated int64 rightfunctiondata = 13;

	// How the two sides are combined. Comparisons (the default) apply `operator` to the two
	// values; AndCondition / OrCondition instead treat both sides as conditions and combine their
	// truth values, which is the only way to gate a trigger on more than one thing.
	optional TriggerConditionType type = 14 [default = IntegerComparison];
}

message TriggerAction {
	optional uint32 action = 1;
	optional uint32 target = 2;
	optional string targetname = 3;
	repeated string texts = 4;
	repeated int32 data = 5;

	// Per-locale overrides for the primary user-facing text (texts[0]), used by the
	// Say / Yell / Emote actions. The base English text stays in texts[0]; these are
	// additive overrides keyed by LocaleIndex (see base/localization.h). Server-only:
	// triggers are never shipped to the client, so no client_data mirror is required.
	repeated LocalizedString texts_loc = 200;
}

message TriggerEvent {
	required uint32 type = 1;
	repeated uint32 data = 2;
}

message TriggerEntry {
	required uint32 id = 1;
	required string name = 2;
	optional uint32 flags = 3;
	optional uint32 categoryid = 4;
	repeated TriggerAction actions = 5;
	repeated TriggerEvent newevents = 6;
	optional uint32 probability = 7 [default = 100];
	optional TriggerCondition condition = 8;
}

message Triggers {
	repeated TriggerEntry entry = 1;
}
