syntax = "proto2";
package mmo.proto_client;

// Per-liquid-type presentation settings.
//
// NOTE: Keep this file in sync with src/shared/proto_data/water_profiles.proto!
// This is the client-side mirror of the authoring schema; every field number in here has to
// match it exactly. Only the client consumes these values - the server resolves swimming from
// its own water map - but authoring happens in mmo_edit, which works on the proto_data project.
//
// The id matches terrain::WaterType exactly (1 = Water, 2 = Ocean, 3 = Lava, 4 = Slime); a
// unit test asserts that mapping so the two cannot silently drift. Field numbers are part of
// the ClientDB contract and must never be reused or renumbered.
message WaterProfile
{
	required uint32 id = 1;
	required string name = 2;

	// Surface material asset used for this liquid, e.g. "Worlds/Water_Ocean.hmat".
	// A page's own water material name still overrides this when one is set.
	optional string surface_material = 3;

	// Underwater fog colour, packed 0xAARRGGBB.
	optional uint32 fog_color = 4;

	// Underwater fog density per world unit. Higher is murkier.
	optional float fog_density = 5;

	// Beer-Lambert absorption colour, packed 0xAARRGGBB, driving the depth tint.
	optional uint32 absorption_color = 6;

	// Strength of the projected caustics while submerged. 0 disables them.
	optional float caustics_strength = 7;

	// Caustics texture asset, e.g. "Textures/Caustics_01.htex".
	optional string caustics_texture = 8;

	// Low-pass filter cutoff in Hz applied to audio while submerged. 0 leaves audio dry.
	optional float audio_lowpass_hz = 9;

	// Screen distortion strength while submerged. 0 disables it.
	optional float distortion_strength = 10;

	// Looping sound entry played as the calm bed of nearby water of this type. 0 disables the
	// ambience for this profile.
	optional uint32 ambient_calm_sound = 11;

	// Looping sound entry crossfaded in as the water flows faster. 0 means no fast bed.
	optional uint32 ambient_fast_sound = 12;

	// If true, only water bordering land (shorelines) is audible instead of the whole body.
	optional bool ambient_shore_only = 13;

	// 2D sound entry layered in while the player swims in this liquid. 0 disables it.
	optional uint32 ambient_swim_sound = 14;

	// Distance in world units within which this liquid is audible.
	optional float ambient_range = 15 [default = 40];

	// Volume multiplier of the ambience of this liquid.
	optional float ambient_volume = 16 [default = 1];

	// 2D sound entry looped while the player's head is under water of this liquid. It replaces the
	// swim sound while submerged. 0 disables it.
	optional uint32 ambient_underwater_sound = 17;

	// --- FFT ocean (only read for the Ocean liquid, id 2) -----------------------------------
	// Every field is optional; an unset field keeps the engine's built-in default
	// (deferred_shading/ocean_settings.h), so an empty profile already looks right.

	// Wind speed in m/s. Drives wave height and wavelength.
	optional float ocean_wind_speed = 18;

	// Direction the wind (and the waves) travel toward, in degrees. 0 = +X, 90 = +Z.
	optional float ocean_wind_direction = 19;

	// Distance the wind has blown over open water, in km. Short = choppy, long = rolling swell.
	optional float ocean_fetch = 20;

	// Directional spreading. Low = confused sea, high = long parallel crests.
	optional float ocean_spread = 21;

	// Multiplier on wave height.
	optional float ocean_wave_scale = 22;

	// How sharp the crests are (horizontal displacement factor).
	optional float ocean_choppiness = 23;

	// Multiplier on wave speed.
	optional float ocean_wave_speed = 24;

	// Body colour of the water in the wave troughs, packed 0xAARRGGBB (sRGB).
	optional uint32 ocean_trough_color = 25;

	// Body colour at the crests where sunlight shines through thin water, packed 0xAARRGGBB (sRGB).
	optional uint32 ocean_crest_color = 26;

	// Light absorbed per metre of water (linear, per channel). Red dies first in clear sea water.
	optional float ocean_absorption_r = 27;
	optional float ocean_absorption_g = 28;
	optional float ocean_absorption_b = 29;

	// Strength of sunlight glowing through wave crests.
	optional float ocean_subsurface_strength = 30;

	// Surface roughness of calm water; higher blurs reflections and widens the sun glint.
	optional float ocean_roughness = 31;

	// Multiplier on reflections.
	optional float ocean_reflection_strength = 32;

	// How readily breaking crests turn white.
	optional float ocean_foam_coverage = 33;

	// Brightness of the foam.
	optional float ocean_foam_brightness = 34;

	// Strength of the foam band along the shore.
	optional float ocean_shore_foam_strength = 35;
}

message WaterProfiles
{
	repeated WaterProfile entry = 1;
}
