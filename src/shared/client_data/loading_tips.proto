syntax = "proto2";
package mmo.proto_client;

import "localization.proto";

// NOTE: Keep this file in sync with src/shared/proto_data/loading_tips.proto!
// The client reads the exported binary data with this mirrored schema, so every field
// number in here has to match the mirror exactly.

// A tip shown on the loading screen. One is picked at random each time the screen appears.
message LoadingTip
{
	required uint32 id = 1;

	// Editor-only label shown in the entry list.
	required string name = 2;

	// The tip as shown on the loading screen (base English text).
	optional string text = 3;

	repeated LocalizedString text_loc = 200;
}

message LoadingTips
{
	repeated LoadingTip entry = 1;
}
