syntax = "proto2";
package mmo.proto_client;

message MapEntry {
	required uint32 id = 1;
	required string name = 2;
	required string directory = 3;
	enum MapInstanceType {
		GLOBAL = 0;
		DUNGEON = 1;
		RAID = 2;
		BATTLEGROUND = 3;
		ARENA = 4;
	}
	optional MapInstanceType instancetype = 4 [default = GLOBAL];
	// Environment profile used where no zone sets one. 0 = built-in Default.
	optional uint32 environment_profile = 9;
}

message Maps {
	repeated MapEntry entry = 1;
}
