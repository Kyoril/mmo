name: Linux Servers

on:
  push:
    branches:
      - develop

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:        
    - uses: actions/checkout@v1

    # Before the build: it takes milliseconds, needs no toolchain, and catches a wire format
    # change that shipped without the version bump that would reject incompatible peers.
    - name: protocol version check
      run: python3 tools/protocol_version_check.py

    - name: configure
      run: sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get install gcc-13 g++-13 libmysqlclient-dev uuid-dev && git submodule update --init
      
    - name: cmake
      run:   mkdir build && cd build && cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ../
      shell: bash
      env:
        CC:   gcc-13
        CXX:  g++-13
        
    - name: make
      run: cd build && make
      
    - name: unit tests
      run: cd bin && ./unit_tests
      
